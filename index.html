<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Бидний болзоо 💗</title>

<style>

body {
    margin:0;
    height:100vh;
    background:linear-gradient(#ffd6e8,#fff);
    font-family:Arial,sans-serif;
    text-align:center;
    overflow:hidden;
}

.page {
    display:none;
    padding-top:100px;
}

.active {
    display:block;
}

h1 {
    color:#ff4f8b;
    font-size:35px;
}

button {
    padding:15px 35px;
    border:none;
    border-radius:30px;
    font-size:20px;
    margin:20px;
}

#yes {
    background:#ff4f8b;
    color:white;
}

#no {
    background:#ddd;
    position:absolute;
}

.heart {
    position:absolute;
    bottom:-20px;
    font-size:30px;
    animation:heart 3s linear forwards;
}

@keyframes heart {

0% {
    transform:translateY(0) rotate(0);
    opacity:1;
}

100% {
    transform:translateY(-100vh) rotate(360deg);
    opacity:0;
}

}

</style>

</head>


<body>


<div id="page1" class="page active">

<h1>
Надтай болзох уу? 💗
</h1>

<button id="yes" onclick="yesClick()">
Тийм 💕
</button>


<button id="no" onmouseover="moveNo()">
Үгүй 😢
</button>


</div>



<div id="page2" class="page">

<h1>
💗 Хүсэлтийг зөвшөөрсөнд баярлалаа 💗
</h1>

<p>
За зүгээр дээ, хайртай юм чинь 🫶
</p>


<button onclick="nextPage()">
Дараагийнх
</button>


</div>



<script>


function moveNo(){

let no=document.getElementById("no");

no.style.left=Math.random()*80+"%";
no.style.top=Math.random()*80+"%";

}



function yesClick(){

for(let i=0;i<80;i++){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=
(Math.random()*2+2)+"s";


document.body.appendChild(heart);


setTimeout(()=>{
heart.remove();
},3000);

}


setTimeout(()=>{

document.getElementById("page1").classList.remove("active");

document.getElementById("page2").classList.add("active");

},1500);


}



function nextPage(){

alert("Дараагийн хэсэг удахгүй 💗");

}


</script>


</body>
</html>
