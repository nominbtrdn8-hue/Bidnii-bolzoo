<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бидний болзоо 💗</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#ffd6e7, #fff);
    text-align: center;
    color: #444;
}

.container {
    padding: 40px 20px;
}

h1 {
    color: #ff4f8b;
    font-size: 35px;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

.box {
    background: white;
    border-radius: 20px;
    padding: 25px;
    margin: 20px auto;
    max-width: 400px;
    box-shadow: 0 5px 15px #ddd;
}

button {
    background: #ff4f8b;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 30px;
    font-size: 18px;
}

button:hover {
    background: #ff2f70;
}
</style>
</head>

<body>

<div class="container">

<h1>💗 Бидний болзоо 💗</h1>

<div class="box">
<p>
Чамтай өнгөрүүлсэн мөч бүр<br>
миний хувьд хамгийн гоё дурсамж байдаг ❤️
</p>
</div>

<div class="box">
<h2>✨ Бидний тухай ✨</h2>
<p>
Энд бидний түүх, зураг, дурсамжаа нэмэх болно.
</p>
</div>

<div class="box">
<h2>💕 Хайрын зурвас</h2>
<p>
Чи миний хувьд онцгой хүн.
Үргэлж инээмсэглэж байгаарай 🫶
</p>
</div>

<button>
I Love You ❤️
</button>

</div>



</body>
</html>
