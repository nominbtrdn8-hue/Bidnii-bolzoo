<!DOCTYPE html>
<html lang="mn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nomin & Batnyam 💗</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap');


*{
box-sizing:border-box;
}


body{

margin:0;
min-height:100vh;
background:linear-gradient(135deg,#ffd1e6,#fff5fa);
font-family:'Quicksand',sans-serif;
overflow:hidden;
text-align:center;

}


.page{

display:none;
min-height:100vh;
padding:40px 20px;
justify-content:center;
align-items:center;

}


.active{

display:flex;

}


.box{

background:rgba(255,255,255,0.9);
width:90%;
max-width:430px;
padding:35px 25px;
border-radius:35px;
box-shadow:0 10px 30px #f5a6c8;

}


h1{

font-family:'Pacifico',cursive;
color:#ff4f91;
font-size:40px;

}


h2{

color:#ff5c9d;

}


p{

font-size:18px;

}


button{

border:none;
border-radius:30px;
padding:15px 30px;
font-size:17px;
margin:10px;
cursor:pointer;

}


.main{

background:#ff5c9d;
color:white;

}


.no{

background:#ddd;
position:absolute;

}


input,select{

width:90%;
padding:13px;
border-radius:20px;
border:1px solid #ffb6d5;
font-size:16px;

}



.heart{

position:fixed;
bottom:-20px;
font-size:30px;
animation:heart 4s linear forwards;

}


@keyframes heart{

0%{
transform:translateY(0) scale(1);
opacity:1;
}

100%{

transform:translateY(-110vh) rotate(360deg);
opacity:0;

}

}


.flower{

position:fixed;
top:-20px;
font-size:25px;
animation:flower 5s linear forwards;

}


@keyframes flower{

100%{

transform:translateY(110vh) rotate(360deg);

}

}


</style>

</head>


<body>


<div id="page1" class="page active">

<div class="box">

<h1>Nomin & Batnyam 💗</h1>

<h2>Надтай болзох уу? 🌸</h2>


<button class="main" onclick="yesClick()">
Тийм 💕
</button>


<button class="no" id="no">
Үгүй 😢
</button>


</div>

</div><!-- Хуудас 2 -->

<div id="page2" class="page">

<div class="box">

<h1>💗 Баярлалаа 💗</h1>

<p>
Хүсэлтийг зөвшөөрсөнд баярлалаа 🫶
</p>


<button class="main" onclick="openDate()">

За зүгээр дээ, хайртай юм чинь 💗

</button>


</div>

</div>




<!-- Хуудас 3 -->

<div id="page3" class="page">

<div class="box">

<h1>
Бидний болзоо 🌸
</h1>


<p>📅 Өдөр</p>

<input type="date" id="date">


<p>⏰ Цаг</p>

<input type="time" id="time">


<p>💕 Юу хийх вэ?</p>

<select id="activity">

<option>🏞 Ханган явах</option>

<option>🍽 Хамт хоол идэх</option>

<option>🦁 Амьтны хүрээлэн үзэх</option>

<option>🌿 Намсан явах</option>


</select>


<br>


<button class="main" onclick="confirmDate()">

💌 Болзоогоо баталгаажуулах

</button>


</div>

</div>





<!-- Хуудас 4 -->

<div id="page4" class="page">

<div class="box">


<h1>
💌 Болзоо баталгаажлаа
</h1>


<p id="invite"></p>


<h2 id="count"></h2>



<button class="main" onclick="saveInvite()">

💾 Урилгаа хадгалах

</button>



<button onclick="restart()">

🔄 Эхнээс нь үзэх

</button>


</div>

</div>




<!-- Хөгжим -->

<button id="musicBtn" onclick="playMusic()">

🎵 Хөгжим асаах

</button><script>


let music =
"https://www.youtube.com/embed/cuuwq7I5Vj0?autoplay=1";



document.getElementById("no").onmouseover=function(){

this.style.left=Math.random()*80+"vw";
this.style.top=Math.random()*80+"vh";

}





function yesClick(){


for(let i=0;i<100;i++){


let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=
(Math.random()*2+2)+"s";


document.body.appendChild(h);


setTimeout(()=>{

h.remove();

},4000);


}



for(let i=0;i<30;i++){


let f=document.createElement("div");

f.className="flower";

f.innerHTML="🌸";

f.style.left=Math.random()*100+"vw";


document.body.appendChild(f);


setTimeout(()=>{

f.remove();

},5000);


}



setTimeout(()=>{

changePage("page1","page2");

},1500);


}





function openDate(){

changePage("page2","page3");

}






function confirmDate(){


let date=
document.getElementById("date").value;


let time=
document.getElementById("time").value;


let activity=
document.getElementById("activity").value;



let data={

date:date,

time:time,

activity:activity

};



localStorage.setItem(
"dateInvite",
JSON.stringify(data)
);



showInvite(data);



changePage("page3","page4");


}





function showInvite(data){


document.getElementById("invite").innerHTML=

"💗 Nomin & Batnyam 💗<br><br>"+
"📅 "+data.date+
"<br>⏰ "+data.time+
"<br>🌸 "+data.activity;



let today=new Date();

let target=new Date(data.date);


let diff=
Math.ceil(
(target-today)/(1000*60*60*24)
);



if(diff<0){

diff=0;

}



document.getElementById("count").innerHTML=

"⏳ Болзоонд "+diff+" хоног үлдлээ 💗";


}





function saveInvite(){


alert(
"💾 Урилга хадгалагдлаа 💗"
);


}





function playMusic(){


let frame=document.createElement("iframe");


frame.src=music;

frame.allow="autoplay";


frame.style.display="none";


document.body.appendChild(frame);



alert("🎵 Хөгжим аслаа 💗");


}





function restart(){

location.reload();

}





function changePage(a,b){


document.getElementById(a)
.classList.remove("active");


document.getElementById(b)
.classList.add("active");


}



</script>


</body>

</html>
